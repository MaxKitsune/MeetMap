name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and generate Prisma client
        id: install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  integration:
    name: PostgreSQL integration and Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meetmap_ci
          POSTGRES_PASSWORD: meetmap-ci-disposable
          POSTGRES_DB: meetmap_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U meetmap_ci -d meetmap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # These values belong only to this disposable runner. No secrets, production
    # environments, self-hosted runners, personal data volumes, or live services.
    env:
      DATABASE_URL: postgresql://meetmap_ci:meetmap-ci-disposable@127.0.0.1:5432/meetmap_test
      APP_URL: http://localhost:3001
      TEST_BASE_URL: http://localhost:3001
      UPLOAD_DIR: ./work/test-uploads
      OLLAMA_URL: http://127.0.0.1:9
      GEOCODER_URL: http://127.0.0.1:9
      TILE_URL_TEMPLATE: http://127.0.0.1:9/{z}/{x}/{y}.png
      IMMICH_URL: ""
      IMMICH_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Write disposable test configuration
        # anticipation.mjs loads .env; never copy a developer's .env or use secrets.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('.env', `DATABASE_URL=${process.env.DATABASE_URL}\n`, { mode: 0o600 });
          NODE
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run integration and Playwright suites
        run: bash scripts/test-ci.sh
      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          path: |
            work/ci/server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
